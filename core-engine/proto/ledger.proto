syntax = "proto3";

package ledger;

service LedgerService {
  rpc PostTransaction (PostTransactionRequest) returns (PostTransactionResponse);
  rpc GetLedgerEntry (GetLedgerEntryRequest) returns (GetLedgerEntryResponse);
}

message PostTransactionRequest {
  string tx_id = 1;
  string debit_account = 2;
  string credit_account = 3;
  int64 amount = 4;
}

message PostTransactionResponse {
  bool success = 1;
  string message = 2;
}

message GetLedgerEntryRequest {
  string tx_id = 1;
}

message GetLedgerEntryResponse {
  string tx_id = 1;
  string debit_account = 2;
  string credit_account = 3;
  int64 amount = 4;
}
