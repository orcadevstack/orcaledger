syntax = "proto3";

package ledger;

service LedgerService {
  rpc PostTransaction (TransactionRequest) returns (TransactionResponse);
}

message TransactionRequest {
  string tx_id = 1;
  int64 debit = 2;
  int64 credit = 3;
}

message TransactionResponse {
  bool success = 1;
  string message = 2;
}
