syntax = "proto3";

package settlement;

service SettlementService {
  rpc StartBatch (StartBatchRequest) returns (SettlementResponse);
  rpc AddEntry (AddEntryRequest) returns (SettlementResponse);
  rpc FinalizeBatch (FinalizeBatchRequest) returns (SettlementBatch);
}

message StartBatchRequest {
  string batch_id = 1;
}

message AddEntryRequest {
  string batch_id = 1;
  string debit_bank = 2;
  string credit_bank = 3;
  int64 amount = 4;
}

message FinalizeBatchRequest {
  string batch_id = 1;
}

message SettlementResponse {
  bool success = 1;
  string message = 2;
}

message SettlementBatch {
  string batch_id = 1;
  int64 total_debit = 2;
  int64 total_credit = 3;
  int64 net_position = 4;
}
